<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="style.css" />
  <script src="script.js" defer></script>
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <h1>Calculator</h1>
    <div class="display-wrap">
      <input id="display" class="display" type="text" value="0" aria-label="Calculator display" readonly />
    </div>
    <div class="keys" aria-label="Calculator keys">
      <button class="key key-function" data-action="clear">AC</button>
      <button class="key key-function" data-action="delete" aria-label="Delete last character">DEL</button>
      <button class="key key-function" data-value="%">%</button>
      <button class="key key-operator" data-value="÷">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key key-operator" data-value="×">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key key-operator" data-value="−">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key key-operator" data-value="+">+</button>

      <button class="key key-zero" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key key-equals" data-action="calculate">=</button>
    </div>
  </main>
</body>
</html>
